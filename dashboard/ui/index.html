<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Not the name of any one project. The tool serves an ecosystem and names it in
     the header; baking one into the chrome is how a window title goes on saying
     the wrong thing while the workspace serves something else. -->
<title>Dashboard</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot" id="link-dot" title="live log stream"></span>
    <strong>Dashboard</strong>
    <!-- Which ecosystem this is serving, and where it lives. Everything on every
         tab comes from it, and it has to be visible without opening JSON. -->
    <span class="muted" id="ecosystem"></span>
    <span class="muted mono" id="workspace"></span>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="ops">Operations</button>
    <!-- The badge is what makes a tab you cannot see safe to have: output
         arriving behind it is announced, and a failure differently from
         ordinary chatter. -->
    <button class="tab" data-view="live">Live <span class="tab-badge hidden" id="live-badge"></span></button>
    <button class="tab" data-view="work">Work</button>
    <button class="tab" data-view="actions">All actions</button>
  </nav>
  <div class="topright muted" id="topright"></div>
</header>

<!-- The answer to a button press, in the same place as the button. Reporting a
     result somewhere the operator is not looking reads exactly like nothing
     having happened. -->
<div id="notice" class="notice hidden"></div>

<!-- Above everything: a repo that is not where the project says it is makes every
     other answer on the page unreliable. -->
<div id="trouble" class="stale-banner hidden"></div>

<main>

  <!-- ---------------- Operations ---------------- -->
  <section class="view active" id="view-ops">
    <div class="cols">

      <div class="col narrow">
        <h2>Virtual machines</h2>
        <div id="vms" class="stack"></div>
        <button class="btn wide" id="add-vm-open">Make one</button>
      </div>

      <div class="col">
        <!-- Actions act on the SELECTED virtual machine, so one set of buttons
             serves every one of them instead of each card carrying its own copy. -->
        <h2>Actions <span class="muted" id="actions-context">— nothing selected</span></h2>
        <div id="machine-actions" class="panel"></div>

        <h2>Tasks <span class="muted" id="tasks-context"></span></h2>
        <div id="tasks" class="stack"></div>
      </div>

      <div class="col wide">
        <h2>In flight</h2>
        <div id="doing" class="stack"></div>
      </div>

    </div>
  </section>

  <!-- ---------------- Live ----------------
       Never torn down and never stops appending. Its whole value is that it is
       watching while you are doing something else, so a stream that dropped
       while the view was hidden would lose exactly the output you switched away
       to cause. The element stops being displayed; the subscription is global. -->
  <section class="view" id="view-live">
    <div class="sync-head">
      <h2>Live <span class="muted" id="live-context"></span></h2>
      <div class="sync-controls">
        <label class="inline"><input type="checkbox" id="log-follow" checked> Follow</label>
        <input id="log-find" placeholder="find text">
        <button class="btn" id="log-clear">Clear</button>
      </div>
    </div>
    <!-- Built from the tags actually present, so a new tag anywhere becomes a
         filter without being registered. -->
    <div id="log-tags" class="chips"></div>
    <div id="live" class="console tall"></div>
  </section>

  <!-- ---------------- Work ---------------- -->
  <section class="view" id="view-work">
    <div class="cols">
      <div class="col">
        <h2>Attempts</h2>
        <div id="work-list" class="stack"></div>
      </div>
      <div class="col wide">
        <h2 id="work-detail-title">Select an attempt</h2>
        <div id="work-detail"></div>
      </div>
    </div>
  </section>

  <!-- ---------------- All actions ---------------- -->
  <section class="view" id="view-actions">
    <p class="note">
      Every capability this server has, generated from <code>/api/actions</code> &mdash;
      the same table the window and the cli both work from. Nothing can exist
      without appearing here.
    </p>
    <div id="action-list"></div>
  </section>

</main>

<script src="ui.js"></script>
</body>
</html>
