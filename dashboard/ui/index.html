<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work</title>
<link rel="stylesheet" href="/ui.css">
</head>
<body>

<header>
  <h1>Work</h1>
  <p id="where">…</p>
</header>

<nav id="tabs">
  <button data-tab="loop" class="on">Work</button>
  <button data-tab="machines">Machines</button>
  <button data-tab="log">Live log</button>
</nav>

<!-- Absent repos are said out loud: a tool that looks healthy while pointing at
     nothing is the failure this prevents. -->
<section id="trouble" hidden></section>

<div class="tab" data-tab="loop">
  <section>
    <h2>What you are working on</h2>
    <div id="doing-list"></div>
  </section>
  <section>
    <h2>What is worth doing</h2>
    <div id="task-list"></div>
  </section>
  <section>
    <h2>Finished</h2>
    <div id="past-list"></div>
  </section>
</div>

<div class="tab" data-tab="machines" hidden>
  <section>
    <h2>Machines</h2>
    <div id="machine-list"></div>
    <details id="add-machine">
      <summary>Add a machine</summary>
      <div class="form">
        <label>Name <input id="m-name" placeholder="dev box"></label>
        <label>Where is it
          <select id="m-kind">
            <option value="local">This machine</option>
            <option value="ssh">Another machine, over ssh</option>
          </select>
        </label>
        <label id="m-host-wrap" hidden>Address <input id="m-host" placeholder="user@127.0.0.1 -p 2222"></label>
        <label>Folder to open <input id="m-path" placeholder="/home/you/work"></label>
        <label>VS Code command <input id="m-editor" placeholder="leave empty to find it automatically"></label>
        <label>Virtual machine name <input id="m-vm" placeholder="leave empty if it is not a VM"></label>
        <div class="row"><button id="m-add">Add it</button></div>
      </div>
    </details>
  </section>

  <section>
    <h2>Virtual machines</h2>
    <div id="vm-list"></div>
    <details id="add-vm">
      <summary>Make a new virtual machine</summary>
      <div class="form">
        <label>Name <input id="vm-name" placeholder="dev1"></label>
        <label>Memory, in MB <input id="vm-memory" type="number" value="4096"></label>
        <label>Processors <input id="vm-cpus" type="number" value="2"></label>
        <label>Disk, in GB <input id="vm-disk" type="number" value="30"></label>
        <label>ssh reaches it on port <input id="vm-ssh" type="number" value="2222"></label>
        <label>Installer image, if you have one <input id="vm-iso" placeholder="C:\path\to\ubuntu.iso"></label>
        <p class="hint">This makes the machine and its disk. It does not install an operating system — attach an installer above and boot it.</p>
        <div class="row"><button id="vm-add">Make it</button></div>
      </div>
    </details>
  </section>
</div>

<div class="tab" data-tab="log" hidden>
  <section>
    <h2>Live log</h2>
    <div class="row" id="log-tags"></div>
    <div class="row logbar">
      <label class="inline"><input type="checkbox" id="log-follow" checked> Follow</label>
      <input id="log-find" placeholder="find text">
      <button class="quiet" id="log-clear">Clear</button>
      <span id="log-count" class="hint"></span>
    </div>
    <div id="log"></div>
  </section>
</div>

<dialog id="ask">
  <h3 id="ask-title"></h3>
  <div id="ask-body"></div>
  <label id="ask-note-wrap" hidden>
    <span>In one line, what did you check?</span>
    <input id="ask-note" autocomplete="off" placeholder="read both diffs, the wording is accurate">
  </label>
  <p id="ask-error" hidden></p>
  <div class="row">
    <button id="ask-no" class="quiet">Never mind</button>
    <button id="ask-yes"></button>
  </div>
</dialog>

<script src="/ui.js"></script>
</body>
</html>
